name: Blender 5.2 LTS CLI Image Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render_scene:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Gdown
      run: |
        python -m pip install --upgrade pip
        pip install gdown

    - name: Download Blend File from Google Drive
      run: |
        gdown 12T3AYU3N-h9CCL50Bv4MsncsGeWeuXuT

    - name: Check Downloaded File Size
      run: ls -lh Konqi_drive.blend

    - name: Install Blender 5.2 LTS
      run: |
        wget https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
        tar -xf blender-5.2.0-linux-x64.tar.xz
        echo "$GITHUB_WORKSPACE/blender-5.2.0-linux-x64" >> $GITHUB_PATH

    - name: Verify Blender Version
      run: blender --version

    - name: Render Animation
      run: |
        # 1. Force the runner to see the installed Blender binary in this step
        export PATH="$GITHUB_WORKSPACE/blender-5.2.0-linux-x64:$PATH"

        # 2. Creates the output directory for frames
        mkdir -p render_output
        
        # 3. Executes headless background render
        # CHANGED: Swapped '//' (Windows style) for './' (Linux runner style)
        blender -b "Konqi_drive.blend" -o "./render_output/frame_#####" -a
        
    - name: Upload Rendered Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rendered-image
        path: render_output_*
