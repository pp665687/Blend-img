name: Blender 5.2 LTS CLI Image Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render_scene:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Gdown
      run: |
        python -m pip install --upgrade pip
        pip install gdown

    - name: Download Blend File from Google Drive
      run: |
        gdown 1Tx4XkiEk4f9PayZ7vcoJL1Zu2-E3Px3b

    - name: Check Downloaded File Size
      run: | 
         unzip "New_Folder.zip"
         ls -lh

    - name: Install Blender 5.2 LTS
      run: |
        wget https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
        tar -xf blender-5.2.0-linux-x64.tar.xz
        echo "$GITHUB_WORKSPACE/blender-5.2.0-linux-x64" >> $GITHUB_PATH

    - name: Verify Blender Version
      run: blender --version

    - name: Execute Background Render
      timeout-minutes: 240
      run: |
        export PATH="$GITHUB_WORKSPACE/blender-5.2.0-linux-x64:$PATH"
        mkdir -p render_output
        
        # 1. Create a Python script that forces Blender to update paths and reload files
        cat << 'EOF' > fix_textures.py
        import bpy
        import os

        # Define the target folder where files are unzipped
        target_dir = os.path.abspath("New Folder")

        for img in bpy.data.images:
            if img.type == 'IMAGE':
                filename = os.path.basename(img.filepath)
                new_path = os.path.join(target_dir, filename)
                
                if os.path.exists(new_path):
                    img.filepath = new_path
                    img.reload()  # Forces Cycles to load the file into memory right now
                    print(f"[SUCCESS] Relinked and loaded texture: {new_path}")
                else:
                    print(f"[WARNING] Could not find {filename} in {target_dir}")

        # Set lower samples to speed up the CPU render
        bpy.context.scene.cycles.samples = 4
        EOF

        # 2. Render out as high-quality individual PNG frames first (Bypasses Blender MKV bug)
        blender -b "New Folder/Untitled1.blend" -E CYCLES -P fix_textures.py -o "./render_output/frame_#####" -F PNG -a -- --cycles-device CPU

    - name: Compile Frames into True MP4 Video
      run: |
        # CHANGED: Swapped %05d for %04d to match Blender's default 4-digit padding sequence (frame_0110.png)
        ffmpeg -framerate 24 -i ./render_output/frame_%04d.png -c:v libx264 -pix_fmt yuv420p ./render_output/animation_0001-0110.mp4
        
    - name: Upload Clean Video Output
      uses: actions/upload-artifact@v4
      with:
        name: rendered-mp4-video
        # Uploads ONLY the perfectly encoded, non-freezing final MP4 file
        path: render_output/animation_0001-0110.mp4
        if-no-files-found: error
