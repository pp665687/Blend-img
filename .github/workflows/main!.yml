name: Blender 5.2 LTS CLI Image Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render_scene:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Gdown
      run: |
        python -m pip install --upgrade pip
        pip install gdown

    - name: Download Blend File from Google Drive
      run: |
        gdown 1vQk5qiaFdPgK6PUcD9UxIBPhBFrt_ZW0

    - name: Check Downloaded File Size
      run: ls -lh Konqi_drive.blend

    - name: Install Blender 5.2 LTS
      run: |
        wget https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz
        tar -xf blender-5.2.0-linux-x64.tar.xz
        echo "$GITHUB_WORKSPACE/blender-5.2.0-linux-x64" >> $GITHUB_PATH

    - name: Verify Blender Version
      run: blender --version

    - name: Execute Background Render
      timeout-minutes: 240
      run: |
        export PATH="$GITHUB_WORKSPACE/blender-5.2.0-linux-x64:$PATH"
        
        # Ensure output folder container is explicitly created before writing
        mkdir -p render_output
        
        # Execute render targeting the subfolder path
        blender -b "Konqi_drive.blend" -E CYCLES -o "./render_output/frame_" -F PNG -f 1 --python-expr "import bpy; bpy.context.scene.cycles.samples = 4" -- --cycles-device CPU
        
    - name: Upload Rendered Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rendered-image
        path: render_output_*
